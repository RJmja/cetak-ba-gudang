<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Berita Acara Serah Terima Barang — PLN</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f2f5;color:#1a1a1a}

/* ===== APP SHELL ===== */
.app{max-width:900px;margin:0 auto;padding:16px}
.app-header{background:#005BAC;color:#fff;padding:14px 20px;border-radius:10px;display:flex;align-items:center;gap:14px;margin-bottom:16px}
.app-header .logo{width:44px;height:44px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.app-header h1{font-size:16px;font-weight:700;letter-spacing:.03em}
.app-header p{font-size:12px;opacity:.85;margin-top:2px}

/* TABS */
.tabs{display:flex;gap:4px;background:#fff;border-radius:10px;padding:6px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tab{flex:1;padding:9px;text-align:center;font-size:13px;font-weight:600;border-radius:7px;border:none;background:none;cursor:pointer;color:#666;transition:all .15s}
.tab.active{background:#005BAC;color:#fff}
.panel{display:none}.panel.active{display:block}

/* CARDS */
.card{background:#fff;border-radius:10px;padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.card-title{font-size:11px;font-weight:700;color:#005BAC;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;padding-bottom:8px;border-bottom:1.5px solid #e8f0fb}

/* FORM */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:600px){.grid2,.grid3{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:#555}
.field input,.field select,.field textarea{padding:8px 10px;font-size:13px;border:1.5px solid #dde3ee;border-radius:7px;background:#fafbfd;color:#1a1a1a;font-family:inherit;transition:border .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#005BAC;outline:none;background:#fff}
.field textarea{resize:vertical;min-height:56px}

/* BARANG ROWS */
.barang-row{display:grid;grid-template-columns:28px 1fr 130px 80px 34px;gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid #f0f2f5}
.barang-row:last-child{border-bottom:none}
@media(max-width:600px){.barang-row{grid-template-columns:1fr;gap:6px}}
.no-badge{width:26px;height:26px;background:#e8f0fb;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#005BAC;flex-shrink:0;margin-top:7px}
.photo-cell{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.photo-thumb{width:62px;height:48px;object-fit:cover;border-radius:5px;border:1.5px solid #dde3ee}
.upload-label{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;font-size:11px;font-weight:600;border:1.5px dashed #b0bcd4;border-radius:5px;cursor:pointer;color:#666;background:#f5f7fb;transition:all .15s}
.upload-label:hover{border-color:#005BAC;color:#005BAC;background:#e8f0fb}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;border:1.5px solid #dde3ee;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#333;transition:all .15s;font-family:inherit}
.btn:hover{background:#f0f2f5;border-color:#bbb}
.btn:active{transform:scale(.97)}
.btn-primary{background:#005BAC;color:#fff;border-color:#005BAC}
.btn-primary:hover{background:#004a91;border-color:#004a91}
.btn-print{background:#1a7a2e;color:#fff;border-color:#1a7a2e;font-size:14px;padding:11px 24px}
.btn-print:hover{background:#155f24}
.btn-danger{color:#c0392b;border:none;background:none;padding:5px 8px;font-size:18px}
.btn-danger:hover{background:#fde8e8;border-radius:6px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.info-badge{display:inline-flex;align-items:center;gap:5px;background:#e8f0fb;color:#005BAC;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;margin-bottom:12px}

/* ===== PREVIEW / PRINT ===== */
#preview-wrap{background:#e8eaf0;padding:16px;border-radius:10px}
.ba-page{width:100%;max-width:740px;margin:0 auto;background:#fff;padding:36px 44px;font-family:'Times New Roman',Times,serif;font-size:13px;color:#111;line-height:1.6;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.ba-header-row{display:flex;align-items:center;gap:16px;padding-bottom:12px;border-bottom:3px double #111;margin-bottom:20px}
.ba-logo-box{width:64px;height:64px;background:#005BAC;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.ba-logo-box span{color:#fff;font-family:Arial,sans-serif;font-weight:900;font-size:13px;line-height:1}
.ba-logo-box small{color:#FFD700;font-family:Arial,sans-serif;font-size:9px;margin-top:2px}
.ba-title-center{flex:1;text-align:center}
.ba-title-center h1{font-size:15px;font-weight:900;letter-spacing:.06em;margin-bottom:2px}
.ba-title-center p{font-size:11px;color:#555}
.ba-intro{margin-bottom:14px}
.ba-pihak{margin-bottom:12px}
.ba-pihak table{border-collapse:collapse}
.ba-pihak td{padding:1px 4px;vertical-align:top}
.ba-pihak td:first-child{width:75px;font-weight:700}
.ba-pihak td:nth-child(2){width:12px}
.ba-pihak .label-pihak{font-weight:700;margin-top:4px;font-size:13px}
.ba-narasi{margin:12px 0 14px;font-size:13px}
.ba-table{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:12px}
.ba-table th{background:#005BAC;color:#fff;padding:8px 6px;text-align:center;border:1px solid #004a91;font-size:12px}
.ba-table td{border:1px solid #999;padding:6px 8px;vertical-align:middle;text-align:center}
.ba-table td.left{text-align:left}
.ba-table .doc-img{width:80px;height:60px;object-fit:cover;border-radius:3px}
.ba-penutup{font-size:13px;margin-bottom:28px}
.ba-ttd{display:flex;justify-content:space-between}
.ba-ttd-block{text-align:center;width:200px}
.ba-ttd-block .lbl{font-weight:700;font-size:13px}
.ba-ttd-block .role{font-size:12px;color:#444;margin-bottom:64px}
.ba-ttd-block .nm{font-weight:700;font-size:13px;border-top:1px solid #333;display:inline-block;padding-top:3px;min-width:140px}
.ba-ttd-block .jbt{font-size:11px;color:#555;margin-top:2px}
.ba-meta{font-size:11px;color:#888;text-align:right;margin-top:18px;padding-top:8px;border-top:1px solid #ddd}

/* ===== PRINT STYLES ===== */
@media print{
  body{background:#fff}
  .app-header,.tabs,.actions,.card,.info-badge,#form-panel{display:none!important}
  #preview-panel{display:block!important}
  #preview-wrap{background:none;padding:0}
  .ba-page{box-shadow:none;padding:20px;max-width:100%}
}
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <div class="logo">⚡</div>
    <div>
      <h1>Berita Acara Serah Terima Barang</h1>
      <p>Aplikasi Cetak BA Gudang — PLN</p>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('form')">✏️ Form Input</button>
    <button class="tab" onclick="switchTab('preview')">📄 Preview &amp; Cetak</button>
  </div>

  <!-- ======= FORM PANEL ======= -->
  <div id="form-panel" class="panel active">

    <div id="auto-fill-badge" style="display:none" class="info-badge">
      ✅ Data terisi otomatis dari AppSheet
    </div>

    <div class="card">
      <div class="card-title">📋 Info Transaksi</div>
      <div class="grid3">
        <div class="field"><label>ID Transaksi</label><input id="f-id" placeholder="cth: 30c8ceac" /></div>
        <div class="field"><label>Tanggal</label><input type="date" id="f-tanggal" /></div>
        <div class="field"><label>Tujuan Unit</label><input id="f-unit" placeholder="cth: ULP MAKOTA" /></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">👤 Pihak Pertama — Yang Menyerahkan</div>
      <div class="grid3">
        <div class="field"><label>Nama Lengkap</label><input id="p1-nama" placeholder="Nama lengkap" /></div>
        <div class="field"><label>Jabatan</label><input id="p1-jabatan" placeholder="cth: SPV K3LH" /></div>
        <div class="field"><label>Unit / Alamat</label><input id="p1-alamat" placeholder="cth: UL MAJALAYA" /></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">👤 Pihak Kedua — Yang Menerima</div>
      <div class="grid3">
        <div class="field"><label>Nama Lengkap</label><input id="p2-nama" placeholder="Nama lengkap" /></div>
        <div class="field"><label>Jabatan</label><input id="p2-jabatan" placeholder="cth: KOORDINATOR ULP" /></div>
        <div class="field"><label>Unit / Alamat</label><input id="p2-alamat" placeholder="cth: ULP RANCAEKEK" /></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📦 Daftar Barang</div>
      <div id="barang-list"></div>
      <div style="margin-top:12px">
        <button class="btn" onclick="addBarang()">＋ Tambah Barang</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📝 Keterangan & Catatan</div>
      <div class="grid2">
        <div class="field"><label>Keterangan</label><input id="f-ket" placeholder="cth: RUSAK / TEMUAN / PEMAKAIAN" /></div>
        <div class="field"><label>Catatan Tambahan</label><textarea id="f-catatan" placeholder="Catatan opsional..."></textarea></div>
      </div>
    </div>

    <div class="actions">
      <button class="btn" onclick="clearForm()">🗑️ Bersihkan</button>
      <button class="btn btn-primary" onclick="doPreview()">👁️ Preview BA →</button>
    </div>
  </div>

  <!-- ======= PREVIEW PANEL ======= -->
  <div id="preview-panel" class="panel">
    <div class="actions" style="margin-bottom:12px">
      <button class="btn" onclick="switchTab('form')">← Edit Data</button>
      <button class="btn btn-print" onclick="window.print()">🖨️ Cetak / Simpan PDF</button>
    </div>
    <div id="preview-wrap">
      <div class="ba-page" id="ba-content">
        <p style="text-align:center;color:#aaa;padding:40px">Isi form lalu klik "Preview BA"</p>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
//  STATE
// ============================================================
var items = [];
var photos = {};

// ============================================================
//  BACA URL PARAMETER (dari AppSheet)
// ============================================================
function readURL() {
  var p = new URLSearchParams(window.location.search);
  if (!p.toString()) return;

  var set = function(id, val) { var el = document.getElementById(id); if (el && val) el.value = val; };

  set('f-id',      p.get('id'));
  set('f-tanggal', p.get('tanggal'));
  set('f-unit',    p.get('unit'));
  set('p1-nama',   p.get('p1nama'));
  set('p1-jabatan',p.get('p1jabatan'));
  set('p1-alamat', p.get('p1alamat'));
  set('p2-nama',   p.get('p2nama'));
  set('p2-jabatan',p.get('p2jabatan'));
  set('p2-alamat', p.get('p2alamat'));
  set('f-ket',     p.get('keterangan'));
  set('f-catatan', p.get('catatan'));

  // Barang bisa berupa beberapa item, dipisah tanda |
  // Format: barang=NAMA1|NAMA2   merek=MEREK1|MEREK2   jumlah=1|2
  var namaList   = (p.get('barang')  || '').split('|').filter(Boolean);
  var merekList  = (p.get('merek')   || '').split('|').filter(Boolean);
  var jumlahList = (p.get('jumlah')  || '').split('|').filter(Boolean);

  items = [];
  for (var i = 0; i < namaList.length; i++) {
    items.push({
      id: Date.now() + i,
      nama:   namaList[i]   || '',
      merek:  merekList[i]  || '',
      jumlah: jumlahList[i] || '1'
    });
  }
  if (!items.length) items.push({id:Date.now(),nama:'',merek:'',jumlah:'1'});

  renderList();
  document.getElementById('auto-fill-badge').style.display = 'inline-flex';
}

// ============================================================
//  RENDER DAFTAR BARANG
// ============================================================
function renderList() {
  var el = document.getElementById('barang-list');
  if (!items.length) {
    el.innerHTML = '<p style="font-size:13px;color:#999;padding:8px 0">Belum ada barang. Klik Tambah Barang.</p>';
    return;
  }
  el.innerHTML = items.map(function(b, i) {
    return '<div class="barang-row" id="row-' + b.id + '">' +
      '<div class="no-badge">' + (i+1) + '</div>' +
      '<div class="field"><label>Nama Barang</label>' +
        '<input value="' + esc(b.nama) + '" oninput="upd(' + b.id + ',\'nama\',this.value)" placeholder="Nama barang" /></div>' +
      '<div class="field"><label>Merek / Type / SN</label>' +
        '<input value="' + esc(b.merek) + '" oninput="upd(' + b.id + ',\'merek\',this.value)" placeholder="Merek / SN" /></div>' +
      '<div class="field"><label>Jml</label>' +
        '<input type="number" min="1" value="' + esc(b.jumlah) + '" oninput="upd(' + b.id + ',\'jumlah\',this.value)" />' +
        '<div class="photo-cell">' +
          (photos[b.id] ? '<img class="photo-thumb" src="' + photos[b.id] + '" alt="foto" />' : '') +
          '<label class="upload-label">📷 Foto<input type="file" accept="image/*" style="display:none" onchange="loadPhoto(' + b.id + ',this)" /></label>' +
        '</div></div>' +
      '<button class="btn-danger" onclick="delBarang(' + b.id + ')" title="Hapus">✕</button>' +
    '</div>';
  }).join('');
}

function esc(s) { return (s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function addBarang() { items.push({id:Date.now(),nama:'',merek:'',jumlah:'1'}); renderList(); }
function delBarang(id) { items = items.filter(function(x){return x.id!==id;}); delete photos[id]; renderList(); }
function upd(id,f,v) { var b=items.find(function(x){return x.id===id;}); if(b) b[f]=v; }
function loadPhoto(id,inp) {
  if (!inp.files[0]) return;
  var r = new FileReader();
  r.onload = function(e){ photos[id] = e.target.result; renderList(); };
  r.readAsDataURL(inp.files[0]);
}

// ============================================================
//  HELPERS
// ============================================================
function val(id) { var el=document.getElementById(id); return el ? el.value : ''; }

function fmtTgl(s) {
  if (!s) return '_______________';
  var d = new Date(s);
  var hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][d.getDay()];
  var bln  = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][d.getMonth()];
  return hari + ', ' + d.getDate() + ' ' + bln + ' ' + d.getFullYear();
}

function switchTab(t) {
  document.querySelectorAll('.tab').forEach(function(el,i){
    el.classList.toggle('active', (i===0&&t==='form')||(i===1&&t==='preview'));
  });
  document.getElementById('form-panel').classList.toggle('active', t==='form');
  document.getElementById('preview-panel').classList.toggle('active', t==='preview');
}

function clearForm() {
  ['f-id','f-tanggal','f-unit','p1-nama','p1-jabatan','p1-alamat','p2-nama','p2-jabatan','p2-alamat','f-ket','f-catatan']
    .forEach(function(id){ var el=document.getElementById(id); if(el) el.value=''; });
  items=[]; photos={};
  renderList();
  document.getElementById('auto-fill-badge').style.display='none';
}

// ============================================================
//  GENERATE PREVIEW BA
// ============================================================
function doPreview() {
  var p1 = { nama: val('p1-nama')||'_______________', jabatan: val('p1-jabatan')||'_______________', alamat: val('p1-alamat')||'_______________' };
  var p2 = { nama: val('p2-nama')||'_______________', jabatan: val('p2-jabatan')||'_______________', alamat: val('p2-alamat')||'_______________' };
  var tgl  = fmtTgl(val('f-tanggal'));
  var unit = val('f-unit') || '_______________';
  var idTx = val('f-id');

  var rows = items.map(function(b,i){
    return '<tr>' +
      '<td>' + (i+1) + '</td>' +
      '<td class="left"><strong>' + (b.nama||'—') + '</strong></td>' +
      '<td>' + (b.merek||'—') + ' / ' + (b.jumlah||1) + '</td>' +
      '<td>' + (photos[b.id] ? '<img class="doc-img" src="'+photos[b.id]+'" alt="dok" />' : '<span style="color:#ccc;font-size:11px">—</span>') + '</td>' +
    '</tr>';
  }).join('');

  var ket = val('f-ket');
  var cat = val('f-catatan');

  document.getElementById('ba-content').innerHTML =
    '<div class="ba-header-row">' +
      '<div class="ba-logo-box"><span>PLN</span><small>⚡ ES</small></div>' +
      '<div class="ba-title-center"><h1>BERITA ACARA SERAH TERIMA BARANG</h1><p>Tujuan Unit: ' + unit + (idTx?' &nbsp;|&nbsp; ID: '+idTx:'') + '</p></div>' +
    '</div>' +

    '<p class="ba-intro">Kami yang bertanda tangan dibawah ini, Pada hari ini <strong>' + tgl + '</strong> :</p>' +

    '<div class="ba-pihak"><table><tbody>' +
      '<tr><td>Nama</td><td>:</td><td><strong>' + p1.nama + '</strong></td></tr>' +
      '<tr><td>Jabatan</td><td>:</td><td>' + p1.jabatan + '</td></tr>' +
      '<tr><td>Alamat</td><td>:</td><td>' + p1.alamat + '</td></tr>' +
    '</tbody></table><p class="label-pihak">Selanjutnya disebut <strong>PIHAK PERTAMA</strong></p></div>' +

    '<div class="ba-pihak"><table><tbody>' +
      '<tr><td>Nama</td><td>:</td><td><strong>' + p2.nama + '</strong></td></tr>' +
      '<tr><td>Jabatan</td><td>:</td><td>' + p2.jabatan + '</td></tr>' +
      '<tr><td>Alamat</td><td>:</td><td>' + p2.alamat + '</td></tr>' +
    '</tbody></table><p class="label-pihak">Selanjutnya disebut <strong>PIHAK KEDUA</strong></p></div>' +

    '<p class="ba-narasi"><strong>PIHAK PERTAMA</strong> menyerahkan barang kepada <strong>PIHAK KEDUA</strong>, dan <strong>PIHAK KEDUA</strong> menyatakan telah menerima barang dari <strong>PIHAK PERTAMA</strong> berupa daftar terlampir :</p>' +

    '<table class="ba-table"><thead><tr>' +
      '<th style="width:36px">NO</th><th>NAMA BARANG</th><th style="width:140px">MEREK / JUMLAH</th><th style="width:110px">DOKUMENTASI</th>' +
    '</tr></thead><tbody>' +
      (rows || '<tr><td colspan="4" style="color:#bbb">— Tidak ada barang —</td></tr>') +
    '</tbody></table>' +

    (ket||cat ? '<p style="font-size:12px;color:#444;margin-bottom:14px"><strong>Keterangan:</strong> ' + (ket||'') + (cat?' &nbsp;|&nbsp; '+cat:'') + '</p>' : '') +

    '<p class="ba-penutup">Demikianlah berita acara serah terima barang ini di perbuat oleh kedua belah pihak, adapun barang-barang tersebut dalam keadaan baik dan cukup.</p>' +

    '<div class="ba-ttd">' +
      '<div class="ba-ttd-block"><div class="lbl">Yang Menyerahkan :</div><div class="role">PIHAK PERTAMA</div><div class="nm">( ' + p1.nama + ' )</div><div class="jbt">' + p1.jabatan + '</div></div>' +
      '<div class="ba-ttd-block"><div class="lbl">Yang Menerima :</div><div class="role">PIHAK KEDUA</div><div class="nm">( ' + p2.nama + ' )</div><div class="jbt">' + p2.jabatan + '</div></div>' +
    '</div>' +

    '<div class="ba-meta">Dicetak: ' + new Date().toLocaleString('id-ID') + '</div>';

  switchTab('preview');
}

// ============================================================
//  INIT
// ============================================================
document.getElementById('f-tanggal').value = new Date().toISOString().split('T')[0];
items.push({id: Date.now(), nama:'', merek:'', jumlah:'1'});
renderList();
readURL(); // baca data dari AppSheet kalau ada
</script>
</body>
</html>
